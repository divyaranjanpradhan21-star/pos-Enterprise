name: Enterprise POS Monorepo CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build & Run Automated Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 12.5.1

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Domain Property & Math Tests
        run: pnpm --filter @pos/domain test

      - name: Build All Monorepo Packages (tsc & vite)
        run: pnpm build
